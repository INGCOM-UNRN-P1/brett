[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brett"
version = "0.1.0"
description = "Auditor de alineación y padding de estructuras C y optimizador de reordenamiento de campos"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "tree-sitter>=0.24.0,<0.25.0",
    "tree-sitter-c>=0.23.2,<0.24.0",
]

[project.scripts]
brett = "brett.cli:main"

[project.entry-points."ripley.plugins"]
padding = "brett.ripley_plugin:BrettPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/brett"]

[tool.pytest.ini_options]
pythonpath = ["src"]
