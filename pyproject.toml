[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brett"
version = "0.1.0"
description = "Auditor de alineación y padding de estructuras C y optimizador de reordenamiento de campos"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
requires-python = ">=3.11"
keywords = ["education", "c-programming", "pedagogical-tools", "unrn"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "tree-sitter>=0.24.0,<0.25.0",
    "tree-sitter-c>=0.23.2,<0.24.0",
]

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN-P1/brett"
Repository = "https://github.com/INGCOM-UNRN-P1/brett.git"
Issues = "https://github.com/INGCOM-UNRN-P1/brett/issues"

[project.scripts]
brett = "brett.cli:main"

[project.entry-points."ripley.plugins"]
padding = "brett.ripley_plugin:BrettPlugin"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/brett"]

[tool.pytest.ini_options]
pythonpath = ["src"]